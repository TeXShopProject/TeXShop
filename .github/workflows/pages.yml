name: Publish website
# added by Terada: Manual deployment only, after review and approval.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Build website
        env:
          REPOSITORY: ${{ github.repository }}
        run: python3 Scripts/build-website.py --repository "$REPOSITORY" --output "$RUNNER_TEMP/texshop-site"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/texshop-site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
